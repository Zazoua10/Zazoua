<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zazoua Admin - لوحة التحكم والإدارة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #f8f9fa; --bg-card: #ffffff; --text-main: #1a1a1a;
            --text-muted: #6c757d; --accent-dark: #121212; --border-color: #e9ecef;
            --brand-gray: #f1f3f5; --success-color: #27ae60; --danger-color: #e74c3c;
            --radius-md: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .admin-title { font-size: 20px; font-weight: 800; }
        .back-to-store { text-decoration: none; background: var(--accent-dark); color: white; padding: 7px 15px; border-radius: 20px; font-size: 12px; font-weight: 700; }

        .admin-layout { display: flex; gap: 15px; align-items: flex-start; }
        .admin-tabs { display: flex; flex-direction: column; gap: 4px; width: 210px; flex: none; background: white; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 10px; position: sticky; top: 15px; }
        .admin-content { flex: 1; min-width: 0; }
        .menu-toggle { display: none; }
        .acc { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 8px; font-size: 12px; }
        .acc > summary { cursor: pointer; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; list-style: none; }
        .acc > summary::-webkit-details-marker { display: none; }
        .acc > summary::after { content: '\25BE'; color: var(--text-muted); }
        .acc[open] > summary::after { content: '\25B4'; }
        .acc-sub { color: var(--text-muted); font-weight: 400; margin-right: auto; }
        .acc-body { padding: 4px 12px 12px; line-height: 1.9; }
        @media (max-width: 768px) {
            .admin-layout { flex-direction: column; }
            .admin-tabs { display: none; width: 100%; position: static; }
            .admin-tabs.open { display: flex; }
            .menu-toggle { display: block; width: 100%; margin-bottom: 10px; padding: 11px; border: none; border-radius: 8px; background: var(--accent-dark); color: #fff; font-weight: 800; cursor: pointer; }
            .admin-content { width: 100%; }
        }
        .tab-btn { background: none; border: none; padding: 11px 14px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-radius: 8px; text-align: right; width: 100%; }
        .tab-btn.active { background: var(--accent-dark); color: white; }

        .admin-section { display: none; background: white; padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
        .admin-section.active { display: block; }

        .form-group { margin-bottom: 12px; }
        .form-label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
        .form-input, .form-select { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 13px; }

        .submit-btn { background: var(--success-color); color: white; border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }
        .admin-order-card { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; font-size: 12px; }

        /* PRINT STYLES - 3 Invoices Per Page */
        @page { size: A4; margin: 8mm; }
        #print-area { display: none; }
        @media print {
            body { padding: 0; background: #fff; }
            body > *:not(#print-area) { display: none !important; }
            #print-area { display: block; width: 100%; background: white; color: #000; }
            .print-invoice-item { min-height: 90mm; border: 1.5px solid #000; border-radius: 8px; padding: 8px 12px; margin-bottom: 3mm; break-inside: avoid; page-break-inside: avoid; display: flex; flex-direction: column; gap: 5px; font-size: 11px; line-height: 1.5; }
            .inv-brand { text-align: center; font-size: 26px; font-weight: 800; letter-spacing: 4px; line-height: 1.2; border-bottom: 2px solid #000; padding-bottom: 3px; }
            .inv-meta { display: flex; justify-content: space-between; font-size: 11px; }
            .inv-cust { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; border: 1px solid #000; border-radius: 6px; padding: 5px 8px; }
            .inv-cust .full { grid-column: 1 / -1; }
            .inv-table { width: 100%; border-collapse: collapse; font-size: 11px; }
            .inv-table th, .inv-table td { border: 1px solid #555; padding: 2px 6px; text-align: right; }
            .inv-table th { background: #eee; }
            .inv-totals { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
            .inv-lines { display: flex; gap: 14px; font-size: 11px; }
            .inv-total { font-size: 15px; font-weight: 800; border: 2px solid #000; border-radius: 6px; padding: 2px 12px; }
            .inv-note { text-align: center; font-weight: 700; font-size: 11px; border: 1px dashed #000; border-radius: 6px; padding: 3px 6px; }
        }

    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول لحماية صفحة الإدارة -->
    <div id="login-overlay" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:9999; display:flex; align-items:center; justify-content:center;">
        <div style="background:white; padding:25px; border-radius:12px; width:100%; max-width:350px;">
            <h3 style="font-size:16px; font-weight:800; margin-bottom:15px; text-align:center;">دخول لوحة تحكم Zazoua</h3>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="admin-email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">كلمة السر</label>
                    <input type="password" id="admin-pass" class="form-input" required>
                </div>
                <button type="submit" class="submit-btn" style="width:100%; background:var(--accent-dark);">دخول</button>
            </form>
        </div>
    </div>

    <div class="admin-header">
        <div class="admin-title">لوحة الإدارة والمتابعة</div>
        <div style="display:flex; gap:8px; align-items:center;">
            <a href="index.html" class="back-to-store"><i class="fa-solid fa-store"></i> المعاينة كعميل</a>
            <button type="button" onclick="handleLogout()" class="back-to-store" style="border:none; cursor:pointer; background:var(--danger-color); font-family:inherit;"><i class="fa-solid fa-right-from-bracket"></i> تسجيل خروج</button>
        </div>
    </div>

    <div id="sound-bar" style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 12px; font-size:12px;">
        <button id="sound-toggle" onclick="toggleSound()" class="submit-btn" style="font-size:12px;"></button>
        <button onclick="document.getElementById('sound-file').click()" class="submit-btn" style="background:var(--accent-dark); font-size:12px;">🎵 اختر صوت من الجهاز</button>
        <input type="file" id="sound-file" accept="audio/*" style="display:none;" onchange="pickSound(this)">
        <button onclick="beep(true)" class="submit-btn" style="background:#2c6fbb; font-size:12px;">▶ تجربة الصوت</button>
        <button onclick="resetSound()" class="submit-btn" style="background:#888; font-size:12px;">الصوت الافتراضي</button>
        <span id="sound-name" style="color:var(--text-muted);"></span>
    </div>

    <button class="menu-toggle" onclick="document.querySelector('.admin-tabs').classList.toggle('open')">☰ القائمة</button>
    <div class="admin-layout">
    <div class="admin-tabs">
        <button class="tab-btn active" onclick="switchTab('orders', this)"><i class="fa-solid fa-boxes-packing"></i> الطلبات الواردة</button>
        <button class="tab-btn" onclick="switchTab('products', this)"><i class="fa-solid fa-shirt"></i> إدارة المنتجات</button>
        <button class="tab-btn" onclick="switchTab('shipping', this)"><i class="fa-solid fa-truck-rampage"></i> أسعار الشحن</button>
        <button class="tab-btn" onclick="switchTab('coupons', this)"><i class="fa-solid fa-ticket"></i> كوبونات الخصم</button>
        <button class="tab-btn" onclick="switchTab('settings', this)"><i class="fa-solid fa-gear"></i> الإعدادات والصفحات</button>
        <button class="tab-btn" onclick="switchTab('stats', this)"><i class="fa-solid fa-chart-line"></i> الإحصائيات</button>
        <button class="tab-btn" onclick="switchTab('reviews', this)"><i class="fa-solid fa-star"></i> التقييمات</button>
        <button class="tab-btn" onclick="switchTab('leads', this)"><i class="fa-solid fa-user-clock"></i> عملاء مهتمين</button>
    </div>

    <div class="admin-content">
    <!-- TAB 1: ORDERS -->
    <div id="tab-orders" class="admin-section active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div>
                <input type="checkbox" id="select-all" onchange="toggleSelectAll(this)">
                <label for="select-all" style="font-size: 12px; font-weight: 700;">تحديد الكل</label>
            </div>
            <div>
                <button onclick="printSelectedInvoices()" class="submit-btn" style="background:var(--accent-dark); font-size:12px;"><i class="fa-solid fa-print"></i> طباعة الفواتير المحددة (3/صفحة)</button>
                <button onclick="deleteSelectedOrders()" class="submit-btn" style="background:var(--danger-color); font-size:12px;"><i class="fa-solid fa-trash"></i> حذف المحدد</button>
                <button onclick="exportToExcel()" class="submit-btn" style="background:#1f7244; font-size:12px;"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
            </div>
        </div>
        <input id="order-search" oninput="renderOrders()" placeholder="بحث بالاسم أو الهاتف أو رقم الطلب أو رقم الشحنة" style="width:100%; padding:9px 10px; margin-bottom:8px; border:1px solid var(--border-color); border-radius:8px; font-size:13px; font-family:inherit;">
        <select id="order-filter" class="form-select" onchange="renderOrders()" style="margin-bottom:10px;">
            <option value="all">كل الطلبات</option><option value="new">جديد</option><option value="confirmed">تم التأكيد</option><option value="shipped">اتشحن</option><option value="delivered">اتسلّم</option><option value="cancelled">ملغي</option>
        </select>
        <div id="admin-orders-list"></div>
    </div>

    <!-- TAB 2: PRODUCTS -->
    <div id="tab-products" class="admin-section">
        <form id="product-form" onsubmit="handleProductSave(event)">
            <input type="hidden" id="edit-prod-id">
            
            <div class="form-group">
                <label class="form-label">صور المنتج (حتى 5 صور، الأولى هي الرئيسية) *</label>
                <input type="file" id="prod-img-file" accept="image/*" multiple onchange="previewImageFile(this)" style="display: none;">
                <div onclick="document.getElementById('prod-img-file').click()" style="height: 120px; border: 2px dashed var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--bg-main); overflow: hidden;">
                    <div id="img-preview-placeholder" style="text-align: center; color: var(--text-muted);">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 24px; margin-bottom: 4px;"></i>
                        <p style="font-size: 11px; font-weight: 700;">اضغط لاختيار صورة المنتج من جهازك</p>
                    </div>
                    <img id="img-preview" src="" style="display: none; width: 100%; height: 100%; object-fit: contain;">
                </div>
                <div id="img-thumbs" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label class="form-label">اسم المنتج *</label>
                    <input type="text" id="prod-title" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">السعر (ج.م) *</label>
                    <input type="number" id="prod-price" class="form-input" required>
                    <input type="number" id="prod-old-price" class="form-input" placeholder="السعر قبل الخصم (اختياري)" style="margin-top:6px;">
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label class="form-label">التصنيف الرئيسي *</label>
                    <select id="prod-main-cat" class="form-select" required>
                        <option value="men">ملابس رجالي</option>
                        <option value="women">ملابس حريمي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">القسم الفرعي *</label>
                    <input type="text" id="prod-sub-cat" class="form-input" placeholder="مثال: شال، بنطلون..." required>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label class="form-label">المقاسات (بفواصل)</label>
                    <input type="text" id="prod-sizes" class="form-input" value="M, L, XL, 2XL" required>
                </div>
                <div class="form-group">
                    <label class="form-label">الألوان (بفواصل)</label>
                    <input type="text" id="prod-colors" class="form-input" value="أسود, أبيض, رمادي" required>
                </div>
            </div>

            <div class="form-group"><label class="form-label">جدول المقاسات لهذا المنتج (اختياري، يظهر للعميل)</label><textarea id="prod-sizechart" class="form-input" rows="3" placeholder="M: صدر 100 - طول 70"></textarea></div>
            <button type="submit" id="prod-save-btn" class="submit-btn" style="background:var(--accent-dark); width: 100%; margin-top: 10px;">حفظ المنتج</button>
            <button type="button" id="prod-cancel-btn" onclick="cancelEdit()" class="submit-btn" style="display:none; background:#888; width:100%; margin-top:6px;">إلغاء التعديل</button>
        </form>

        <hr style="margin:20px 0;">
        <h4 style="font-size:14px; margin-bottom:10px;">قائمة المنتجات الحالية وروابطها للإعلانات:</h4>
        <div id="admin-products-list"></div>
    </div>

    <!-- TAB 3: SHIPPING -->
    <div id="tab-shipping" class="admin-section">
        <form onsubmit="handleAddGov(event)" style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input type="text" id="gov-name" class="form-input" placeholder="اسم المحافظة" required>
            <input type="number" id="gov-price" class="form-input" placeholder="السعر" required>
            <button type="submit" class="submit-btn">إضافة</button>
        </form>
        <div id="shipping-list"></div>
    </div>

    <!-- TAB 4: COUPONS -->
    <div id="tab-coupons" class="admin-section">
        <form onsubmit="handleAddCoupon(event)" style="display:grid; grid-template-columns: 2fr 1fr 1fr auto; gap:8px; margin-bottom:15px; align-items:end;">
            <div class="form-group" style="margin:0;"><label class="form-label">الكود / الجملة</label><input type="text" id="cp-code" class="form-input" placeholder="مثال: خصم الجمعة" required></div>
            <div class="form-group" style="margin:0;"><label class="form-label">النوع</label><select id="cp-type" class="form-select"><option value="percent">نسبة %</option><option value="fixed">مبلغ ثابت</option></select></div>
            <div class="form-group" style="margin:0;"><label class="form-label">القيمة</label><input type="number" id="cp-value" class="form-input" min="1" required></div>
            <button type="submit" class="submit-btn">إضافة</button>
        </form>
        <div id="coupons-list"></div>
    </div>

    <!-- TAB 5: SETTINGS -->
    <div id="tab-settings" class="admin-section">
        <form onsubmit="handleSaveSettings(event)">
            <div class="form-group"><label class="form-label">رقم واتساب المتجر (لاستلام الطلبات وزر تواصل معنا)</label><input type="tel" id="set-wa" class="form-input" placeholder="01XXXXXXXXX"></div>
            <div class="form-group"><label class="form-label">الإعلان الذي يظهر أعلى المتجر</label><input type="text" id="set-banner" class="form-input" placeholder="مثال: شحن مجاني على الطلبات فوق 1000 ج.م"></div>
            <div class="form-group"><label class="form-label">شحن مجاني للطلبات من (ج.م) — اتركه فارغًا لإلغائه</label><input type="number" id="set-free" class="form-input" min="0"></div>
            <div class="form-group"><label class="form-label">جدول مقاسات عام (يظهر لأي منتج ليس له جدول خاص)</label><textarea id="set-sizechart" class="form-input" rows="3"></textarea></div>
            <div class="form-group"><label class="form-label">طرق الدفع (تظهر للعميل عند إتمام الطلب)</label><textarea id="set-payment" class="form-input" rows="3" placeholder="الدفع عند الاستلام. أو التحويل على إنستا باي / فودافون كاش على رقم ..."></textarea></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="form-group"><label class="form-label">Meta Pixel ID</label><input type="text" id="set-meta" class="form-input" placeholder="أرقام فقط"></div>
                <div class="form-group"><label class="form-label">TikTok Pixel ID</label><input type="text" id="set-tiktok" class="form-input" placeholder="مثال: C1234ABCD"></div>
            </div>
            <div class="form-group"><label class="form-label">صفحة "من نحن"</label><textarea id="set-about" class="form-input" rows="5"></textarea></div>
            <div class="form-group"><label class="form-label">صفحة "سياسة الاستبدال والاسترجاع"</label><textarea id="set-policy" class="form-input" rows="5"></textarea></div>
            <div class="form-group"><label class="form-label">صفحة "تواصل معنا" (أرقام، إنستجرام، مواعيد العمل...)</label><textarea id="set-contact" class="form-input" rows="4"></textarea></div>
            <button type="submit" class="submit-btn" style="background:var(--accent-dark); width:100%;">حفظ الإعدادات</button>
        </form>
    </div>

    <div id="tab-reviews" class="admin-section">
        <form onsubmit="handleAddReview(event)" style="margin-bottom:15px;">
            <div style="display:grid; grid-template-columns:2fr 1fr; gap:8px;">
                <input type="text" id="rv-name" class="form-input" placeholder="اسم العميل" required>
                <select id="rv-stars" class="form-select"><option value="5">5 نجوم</option><option value="4">4 نجوم</option><option value="3">3 نجوم</option></select>
            </div>
            <textarea id="rv-text" class="form-input" rows="2" placeholder="نص التقييم" style="margin-top:8px;" required></textarea>
            <button type="submit" class="submit-btn" style="margin-top:8px; width:100%;">إضافة التقييم</button>
        </form>
        <div id="reviews-list"></div>
    </div>

    <div id="tab-leads" class="admin-section">
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">بيانات عملاء بدأوا كتابة طلب ولم يُكملوه (تُحفظ أثناء الكتابة، ولا يظهر من أتمّ طلبه). تواصل معهم بلطف عبر واتساب.</div>
        <div id="leads-list"></div>
    </div>

    <div id="tab-stats" class="admin-section"><div id="stats-box"></div></div>

    </div></div>

    <div id="print-area"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, updateDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        const app = initializeApp({ apiKey: "AIzaSyDsQTX9rCxxT7Dl-OhDSkrce85lM_yDaf4", authDomain: "zazoua-b4d33.firebaseapp.com", projectId: "zazoua-b4d33", storageBucket: "zazoua-b4d33.firebasestorage.app", messagingSenderId: "990100552162", appId: "1:990100552162:web:5b886a47ef93ff3ad7a1bb" });
// App Check (reCAPTCHA Enterprise / Fraud Defense) - لازم يتعمل قبل أي استخدام لـ Firestore
        try { initializeAppCheck(app, { provider: new ReCaptchaEnterpriseProvider("6LeTMBouAAAAAPog_ic7r83Gn1IKcq0C9laQMCqT"), isTokenAutoRefreshEnabled: true }); } catch (e) { console.warn("AppCheck init failed", e); }
        const auth = getAuth(app), db = getFirestore(app);
        const list = async (name) => (await getDocs(collection(db, name))).docs.map(d => d.data());
        window.fb = {
            login: (e, p) => signInWithEmailAndPassword(auth, e, p),
            logout: () => signOut(auth),
            onAuth: (cb) => onAuthStateChanged(auth, cb),
            getProducts: async () => (await list('products')).sort((a, b) => b.id - a.id),
            saveProduct: (p) => setDoc(doc(db, 'products', String(p.id)), p),
            deleteProduct: (id) => deleteDoc(doc(db, 'products', String(id))),
            getShipping: () => list('shipping'),
            saveShipping: (r) => setDoc(doc(db, 'shipping', String(r.id)), r),
            getReviews: async () => (await list('reviews')).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)),
            saveReview: (r) => setDoc(doc(db, 'reviews', r.id), r),
            deleteReview: (id) => deleteDoc(doc(db, 'reviews', String(id))),
            getLeads: () => list('leads'),
            deleteLead: (id) => deleteDoc(doc(db, 'leads', String(id))),
            deleteOrder: async (id) => { await deleteDoc(doc(db, 'orders', String(id))); await deleteDoc(doc(db, 'tracking', String(id))); },
            setTracking: (t) => setDoc(doc(db, 'tracking', String(t.orderId)), t, { merge: true }),
            updateOrder: (id, data) => updateDoc(doc(db, 'orders', String(id)), data),
            deleteShipping: (id) => deleteDoc(doc(db, 'shipping', String(id))),
            getSettings: async () => { const s = await getDoc(doc(db, 'settings', 'main')); return s.exists() ? s.data() : {}; },
            saveSettings: (d) => setDoc(doc(db, 'settings', 'main'), d, { merge: true }),
            getCoupons: () => list('coupons'),
            saveCoupon: (c) => setDoc(doc(db, 'coupons', c.id), c),
            deleteCoupon: (id) => deleteDoc(doc(db, 'coupons', id)),
            watchOrders: (cb, err) => onSnapshot(collection(db, 'orders'), s => cb(s.docs.map(d => d.data())), err),
            getOrders: async () => (await list('orders')).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
        };
    </script>
    <script>
        const defaultShippingRates = [
            { id: 'cairo', name: 'القاهرة', price: 55 },
            { id: 'giza', name: 'الجيزة', price: 55 },
            { id: 'qalyubia', name: 'القليوبية', price: 55 },
            { id: 'alex', name: 'الإسكندرية', price: 60 }
        ];

        let products = [];
        let shippingRates = [];
        let orders = [], coupons = [], settings = {}, reviews = [], leads = [];
        let currentImages = [];

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-pass').value;
            try { await fb.login(email, pass); }
            catch (err) {
                console.error(err);
                const c = String(err && err.code || '');
                let m;
                if (location.protocol === 'file:') m = 'لازم تفتح لوحة الأدمن من رابط الموقع على الإنترنت، مش من الملف على الجهاز.';
                else if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) m = 'الإيميل أو كلمة السر غلط.';
                else if (/too-many-requests/.test(c)) m = 'محاولات كتير، استنى شوية وجرّب تاني.';
                else if (/network-request-failed/.test(c)) m = 'في مشكلة في الاتصال بالإنترنت.';
                else if (/unauthorized-domain/.test(c)) m = 'الدومين ده مش مضاف في Firebase (Authorized domains).';
                else if (/referer|api-key/.test(c)) m = 'مفتاح Firebase مقيّد ومش بيسمح بالدومين ده.';
                else m = 'تعذر تسجيل الدخول: ' + (c || (err && err.message) || 'خطأ غير معروف');
                alert(m);
            }
        }

        let loggingOut = false;
        async function handleLogout() {
            if (!confirm('تسجيل الخروج من لوحة الإدارة؟')) return;
            loggingOut = true;
            try { await fb.logout(); } catch (err) { loggingOut = false; alert('تعذر تسجيل الخروج: ' + err.message); return; }
            document.getElementById('admin-pass').value = '';
            location.reload();
        }

        document.addEventListener('DOMContentLoaded', () => {
            fb.onAuth(user => {
                if (user) { document.getElementById('login-overlay').style.display = 'none'; loadAdminData(); }
                else document.getElementById('login-overlay').style.display = 'flex';
            });
        });

        async function loadAdminData() {
            try {
                products = await fb.getProducts();
                shippingRates = await fb.getShipping();
                if (shippingRates.length === 0) { for (const r of defaultShippingRates) await fb.saveShipping(r); shippingRates = [...defaultShippingRates]; }
                coupons = await fb.getCoupons();
                reviews = await fb.getReviews();
                leads = await fb.getLeads();
                settings = await fb.getSettings();
            } catch (err) { console.error(err); alert('تعذر تحميل البيانات: ' + err.message); }
            renderProductsAdmin(); renderShipping(); renderCoupons(); renderReviews(); renderLeads(); fillSettings(); startOrderWatch();
        }


        function normCode(s) { return s.trim().replace(/\//g, '').replace(/\s+/g, ' ').toUpperCase(); }

        function renderCoupons() {
            document.getElementById('coupons-list').innerHTML = coupons.length ? coupons.map(c => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:var(--bg-main); border:1px solid var(--border-color); border-radius:6px; margin-bottom:6px; font-size:12px; ${c.active ? '' : 'opacity:.55;'}">
                    <span><strong>${c.code}</strong> — ${c.type === 'percent' ? c.value + '%' : c.value + ' ج.م'} ${c.active ? '' : '(متوقف)'}</span>
                    <span>
                        <button onclick="toggleCoupon('${c.id}')" style="cursor:pointer; border:none; color:#fff; background:#666; padding:4px 8px; border-radius:4px; font-size:11px;">${c.active ? 'إيقاف' : 'تفعيل'}</button>
                        <button onclick="deleteCoupon('${c.id}')" style="cursor:pointer; border:none; color:#fff; background:var(--danger-color); padding:4px 8px; border-radius:4px; font-size:11px; margin-right:4px;">حذف</button>
                    </span>
                </div>`).join('') : '<div style="color:var(--text-muted); font-size:12px;">لا توجد كوبونات بعد.</div>';
        }

        async function handleAddCoupon(e) {
            e.preventDefault();
            const code = normCode(document.getElementById('cp-code').value);
            const type = document.getElementById('cp-type').value;
            const value = parseFloat(document.getElementById('cp-value').value);
            if (!code) return;
            if (type === 'percent' && value > 100) { alert('النسبة لا تزيد عن 100'); return; }
            const c = { id: code, code, type, value, active: true };
            try { await fb.saveCoupon(c); } catch (err) { alert('فشل الحفظ: ' + err.message); return; }
            coupons = [...coupons.filter(x => x.id !== c.id), c];
            renderCoupons(); e.target.reset();
        }

        async function toggleCoupon(id) {
            const c = coupons.find(x => x.id === id); if (!c) return;
            const u = { ...c, active: !c.active };
            try { await fb.saveCoupon(u); } catch (err) { alert('فشل الحفظ: ' + err.message); return; }
            coupons = coupons.map(x => x.id === id ? u : x); renderCoupons();
        }

        async function deleteCoupon(id) {
            if (!confirm('حذف الكوبون؟')) return;
            try { await fb.deleteCoupon(id); } catch (err) { alert('فشل الحذف: ' + err.message); return; }
            coupons = coupons.filter(x => x.id !== id); renderCoupons();
        }

        function fillSettings() {
            document.getElementById('set-wa').value = settings.whatsapp || '';
            document.getElementById('set-banner').value = settings.banner || '';
            document.getElementById('set-free').value = settings.freeShipFrom || '';
            document.getElementById('set-sizechart').value = settings.sizeChartText || '';
            document.getElementById('set-payment').value = settings.paymentText || '';
            document.getElementById('set-meta').value = settings.metaPixel || '';
            document.getElementById('set-tiktok').value = settings.tiktokPixel || '';
            document.getElementById('set-about').value = settings.aboutText || '';
            document.getElementById('set-policy').value = settings.policyText || '';
            document.getElementById('set-contact').value = settings.contactText || '';
        }

        async function handleSaveSettings(e) {
            e.preventDefault();
            const d = {
                whatsapp: document.getElementById('set-wa').value.trim(),
                banner: document.getElementById('set-banner').value.trim(),
                freeShipFrom: parseFloat(document.getElementById('set-free').value) || 0,
                sizeChartText: document.getElementById('set-sizechart').value,
                paymentText: document.getElementById('set-payment').value,
                metaPixel: document.getElementById('set-meta').value.trim(),
                tiktokPixel: document.getElementById('set-tiktok').value.trim(),
                aboutText: document.getElementById('set-about').value,
                policyText: document.getElementById('set-policy').value,
                contactText: document.getElementById('set-contact').value
            };
            try { await fb.saveSettings(d); } catch (err) { alert('فشل الحفظ: ' + err.message); return; }
            settings = { ...settings, ...d }; alert('تم حفظ الإعدادات ✅');
        }

        function renderStats() {
            const box = document.getElementById('stats-box'); if (!box) return;
            const ok = orders.filter(o => (o.status || 'new') !== 'cancelled');
            const now = Date.now(), DAY = 864e5;
            const money = n => Math.round(Number(n) || 0).toLocaleString('en-US');
            const tot = o => Number(o.total) || 0;
            const sum = a => a.reduce((s, o) => s + tot(o), 0);
            const within = d => ok.filter(o => o.createdAt && now - o.createdAt < d * DAY);
            const MUTED = 'color:var(--text-muted);';
            const card = (l, a) => `<div style="background:#fff; border:1px solid var(--border-color); border-radius:10px; padding:12px; text-align:center;"><div style="font-size:11px; ${MUTED}">${l}</div><div style="font-size:18px; font-weight:800;">${money(sum(a))} ج.م</div><div style="font-size:11px; ${MUTED}">${a.length} طلب</div></div>`;
            const kpi = (l, v, sub) => `<div style="background:var(--bg-main); border:1px solid var(--border-color); border-radius:10px; padding:10px; text-align:center;"><div style="font-size:11px; ${MUTED}">${l}</div><div style="font-size:17px; font-weight:800;">${v}</div><div style="font-size:10px; ${MUTED}">${sub || '&nbsp;'}</div></div>`;
            const panel = (t, inner) => `<div style="background:#fff; border:1px solid var(--border-color); border-radius:10px; padding:12px;"><h4 style="font-size:13px; margin-bottom:8px;">${t}</h4>${inner}</div>`;
            const empty = '<div style="font-size:12px; color:var(--text-muted);">لا توجد بيانات بعد.</div>';

            // مؤشرات عامة
            const avg = ok.length ? sum(ok) / ok.length : 0;
            const cancelled = orders.length - ok.length;
            const cancelRate = orders.length ? Math.round(cancelled / orders.length * 100) : 0;
            const delivered = orders.filter(o => o.status === 'delivered').length;
            const deliverRate = ok.length ? Math.round(delivered / ok.length * 100) : 0;
            const discountSum = ok.reduce((s, o) => s + (Number(o.discount) || 0), 0);
            const phones = {};
            ok.forEach(o => { const p = String((o.customer && o.customer.phone) || ''); if (p) phones[p] = (phones[p] || 0) + 1; });
            const custs = Object.keys(phones).length, repeat = Object.values(phones).filter(c => c > 1).length;

            // آخر 14 يوم
            const dayKey = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
            const days = [];
            for (let i = 13; i >= 0; i--) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - i); days.push({ k: dayKey(d), label: d.getDate(), n: 0, v: 0 }); }
            ok.forEach(o => { if (!o.createdAt) return; const d = days.find(x => x.k === dayKey(new Date(o.createdAt))); if (d) { d.n++; d.v += tot(o); } });

            // ساعات اليوم
            const hours = Array.from({ length: 24 }, (_, h) => ({ label: h, n: 0 }));
            ok.forEach(o => { if (o.createdAt) hours[new Date(o.createdAt).getHours()].n++; });
            const peak = hours.reduce((a, b) => b.n > a.n ? b : a, hours[0]);

            const bars = (items, h, tip) => {
                const mx = Math.max(1, ...items.map(x => x.n));
                return `<div style="display:flex; align-items:flex-end; gap:3px; height:${h}px;">` + items.map(x => `<div title="${esc(tip(x))}" style="flex:1; min-width:0; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%;"><div style="font-size:9px;">${x.n || ''}</div><div style="width:100%; background:var(--accent-dark); border-radius:3px 3px 0 0; height:${Math.round(x.n / mx * (h - 32))}px; min-height:${x.n ? 2 : 0}px;"></div><div style="font-size:9px; ${MUTED}">${x.label}</div></div>`).join('') + '</div>';
            };
            const rows = (arr, fmt) => {
                if (!arr.length) return empty;
                const mx = Math.max(1, ...arr.map(a => a[1].n));
                return arr.map(([name, d]) => `<div style="margin-bottom:6px; font-size:12px;"><div style="display:flex; justify-content:space-between; gap:8px;"><span>${esc(name)}</span><strong>${fmt(d)}</strong></div><div style="height:5px; background:var(--brand-gray); border-radius:3px; margin-top:2px;"><div style="height:100%; width:${Math.round(d.n / mx * 100)}%; background:var(--accent-dark); border-radius:3px;"></div></div></div>`).join('');
            };
            const tally = (getKey) => {
                const m = {};
                ok.forEach(o => (o.items || []).forEach(i => { const k = getKey(i); if (!k) return; const e = m[k] || (m[k] = { n: 0, v: 0 }); e.n++; e.v += Number(i.price) || 0; }));
                return Object.entries(m).sort((a, b) => b[1].n - a[1].n);
            };
            const gv = {};
            ok.forEach(o => { const g = (o.customer && o.customer.gov) || 'غير محدد'; const e = gv[g] || (gv[g] = { n: 0, v: 0 }); e.n++; e.v += tot(o); });
            const topGov = Object.entries(gv).sort((a, b) => b[1].n - a[1].n).slice(0, 8);
            const cp = {}; orders.forEach(o => { if (o.coupon) { const e = cp[o.coupon] || (cp[o.coupon] = { n: 0 }); e.n++; } });
            const st = Object.entries(STATUSES).map(([k, v]) => `<span style="display:inline-block; margin:0 0 4px 6px; padding:3px 10px; border-radius:12px; background:${STATUS_COLORS[k]}1a; color:${STATUS_COLORS[k]}; font-weight:700;">${v}: ${orders.filter(o => (o.status || 'new') === k).length}</span>`).join('');

            box.innerHTML = `
                <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:8px;">${card('آخر 24 ساعة', within(1))}${card('آخر 7 أيام', within(7))}${card('آخر 30 يوم', within(30))}${card('كل الطلبات (بدون الملغي)', ok)}</div>
                <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:12px;">
                    ${kpi('متوسط قيمة الطلب', money(avg) + ' ج.م', ok.length + ' طلب')}
                    ${kpi('نسبة التسليم', deliverRate + '%', delivered + ' من ' + ok.length)}
                    ${kpi('نسبة الإلغاء', cancelRate + '%', cancelled + ' من ' + orders.length)}
                    ${kpi('عملاء متكررين', repeat, 'من ' + custs + ' عميل')}
                    ${kpi('إجمالي الخصومات', money(discountSum) + ' ج.م', 'كوبونات')}
                </div>
                <div style="font-size:12px; margin-bottom:12px;">${st}</div>
                <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:10px;">
                    ${panel('الطلبات في آخر 14 يوم (رقم اليوم تحت كل عمود)', bars(days, 110, x => x.n + ' طلب - ' + money(x.v) + ' ج.م'))}
                    ${panel('أكتر ساعات الطلب في اليوم' + (peak.n ? ' (الذروة: ' + peak.label + ':00)' : ''), bars(hours, 110, x => x.label + ':00 - ' + x.n + ' طلب'))}
                    ${panel('أكتر المحافظات طلبًا', rows(topGov, d => d.n + ' طلب · ' + money(d.v) + ' ج.م'))}
                    ${panel('الأكثر طلبًا (عدد القطع)', rows(tally(i => i.title).slice(0, 8), d => d.n + ' قطعة · ' + money(d.v) + ' ج.م'))}
                    ${panel('أكتر المقاسات', rows(tally(i => i.size).slice(0, 6), d => d.n + ' قطعة'))}
                    ${panel('أكتر الألوان', rows(tally(i => i.color).slice(0, 6), d => d.n + ' قطعة'))}
                    ${panel('استخدام الكوبونات', rows(Object.entries(cp).sort((a, b) => b[1].n - a[1].n), d => d.n + ' مرة'))}
                </div>`;
        }

        function soundOn() { return localStorage.getItem('zz_sound_off') !== '1'; }

        function renderReviews() {
            document.getElementById('reviews-list').innerHTML = reviews.length ? reviews.map(r => `
                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; background:var(--bg-main); border:1px solid var(--border-color); border-radius:6px; margin-bottom:6px; font-size:12px;">
                    <span><span style="color:#f1c40f;">${'★'.repeat(r.stars)}</span> <strong>${r.name}</strong> — ${r.text}</span>
                    <button onclick="deleteReview('${r.id}')" style="cursor:pointer; border:none; color:#fff; background:var(--danger-color); padding:4px 8px; border-radius:4px; font-size:11px;">حذف</button>
                </div>`).join('') : '<div style="font-size:12px; color:var(--text-muted);">لا توجد تقييمات بعد.</div>';
        }
        async function handleAddReview(e) {
            e.preventDefault();
            const r = { id: 'r' + Date.now(), name: document.getElementById('rv-name').value.trim(), stars: parseInt(document.getElementById('rv-stars').value), text: document.getElementById('rv-text').value.trim(), createdAt: Date.now() };
            try { await fb.saveReview(r); } catch (err) { alert('فشل الحفظ: ' + err.message); return; }
            reviews.unshift(r); renderReviews(); e.target.reset();
        }
        async function deleteReview(id) {
            if (!confirm('حذف التقييم؟')) return;
            try { await fb.deleteReview(id); } catch (err) { alert('فشل الحذف: ' + err.message); return; }
            reviews = reviews.filter(r => r.id !== id); renderReviews();
        }

        function renderLeads() {
            const el = document.getElementById('leads-list'); if (!el) return;
            const done = new Set(orders.map(o => String(o.customer.phone)));
            const when = l => l.updatedAt || l.createdAt || 0;
            const ls = leads.filter(l => !l.ordered && !(l.phone && done.has(l.phone))).sort((a, b) => when(b) - when(a));
            const openedL = new Set(Array.from(el.querySelectorAll('details[open]')).map(d => d.dataset.id));
            const row = (k, v) => v ? `<div><strong>${k}:</strong> ${esc(v)}</div>` : '';
            el.innerHTML = ls.length ? ls.map(l => {
                const key = l.id || l.phone;
                const ph = String(l.phone || '').replace(/\D/g, '');
                const wa = /^01[0125]\d{8}$/.test(ph) ? `<a href="https://wa.me/20${ph.slice(1)}?text=${encodeURIComponent('أهلاً ' + (l.name || '') + '، شوفنا إنك كنت بتطلب من Zazoua. تحب نساعدك تكمّل الطلب؟')}" target="_blank" rel="noopener" style="background:#25D366; color:#fff; padding:4px 8px; border-radius:6px; text-decoration:none; font-weight:700;">واتساب</a>` : '<span style="color:var(--text-muted);">لا يوجد رقم صالح</span>';
                return `
                <details class="acc" data-id="${esc(key)}" ${openedL.has(key) ? 'open' : ''}>
                    <summary><span><strong>${esc(l.name || l.phone || 'عميل بدون اسم')}</strong></span><span class="acc-sub">${l.total ? l.total + ' ج.م' : ''} ${when(l) ? '· ' + new Date(when(l)).toLocaleString('ar-EG') : ''}</span></summary>
                    <div class="acc-body">
                        ${row('الاسم', l.name)}${row('الهاتف', l.phone)}${row('هاتف ثاني', l.phone2)}${row('المحافظة', l.gov)}${row('العنوان', l.address)}${row('المنتجات', l.items)}${row('إجمالي السلة', l.total ? l.total + ' ج.م' : '')}
                        <div style="margin-top:8px;">${wa} <button onclick="deleteLead(this.closest('details').dataset.id)" style="cursor:pointer; border:none; color:#fff; background:var(--danger-color); padding:4px 8px; border-radius:4px; font-size:11px; margin-right:4px;">حذف</button></div>
                    </div>
                </details>`;
            }).join('') : '<div style="font-size:12px; color:var(--text-muted);">لا يوجد عملاء مهتمون حاليًا.</div>';
        }
        async function deleteLead(key) {
            if (!confirm('حذف هذا العميل من القائمة؟')) return;
            try { await fb.deleteLead(key); } catch (err) { alert('فشل الحذف: ' + err.message); return; }
            leads = leads.filter(l => (l.id || l.phone) !== key); renderLeads();
        }

        function beep(force) {
            if (!force && !soundOn()) return;
            const custom = localStorage.getItem('zz_sound_data');
            if (custom) { try { new Audio(custom).play().catch(() => {}); return; } catch (e) {} }
            try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 880; o.start(); setTimeout(() => { o.stop(); c.close(); }, 450); } catch (e) {}
        }

        function updateSoundUI() {
            const on = soundOn(), b = document.getElementById('sound-toggle');
            b.innerText = on ? '🔔 التنبيه: شغال (اضغط للإيقاف)' : '🔕 التنبيه: متوقف (اضغط للتشغيل)';
            b.style.background = on ? '#1f7244' : '#c0392b';
            document.getElementById('sound-name').innerText = localStorage.getItem('zz_sound_data') ? ('الصوت: ' + (localStorage.getItem('zz_sound_name') || 'مخصص')) : 'الصوت: الافتراضي';
        }

        function toggleSound() { localStorage.setItem('zz_sound_off', soundOn() ? '1' : '0'); updateSoundUI(); }

        function pickSound(input) {
            const file = input.files[0]; input.value = '';
            if (!file) return;
            if (file.size > 1024 * 1024) { alert('حجم الملف كبير، اختر صوتًا أقل من 1 ميجا (مدة قصيرة)'); return; }
            const r = new FileReader();
            r.onload = e => {
                try {
                    localStorage.setItem('zz_sound_data', e.target.result);
                    localStorage.setItem('zz_sound_name', file.name);
                    updateSoundUI(); beep(true);
                } catch (err) { alert('تعذر حفظ الصوت، اختر ملفًا أصغر'); }
            };
            r.readAsDataURL(file);
        }

        function resetSound() { localStorage.removeItem('zz_sound_data'); localStorage.removeItem('zz_sound_name'); updateSoundUI(); }
        document.addEventListener('DOMContentLoaded', updateSoundUI);

        let watching = false, firstSnap = true;
        function startOrderWatch() {
            if (watching) return; watching = true;
            fb.watchOrders(list => {
                list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                const added = list.length - orders.length;
                orders = list; renderOrders(); renderStats(); renderLeads();
                if (!firstSnap && added > 0) { beep(); document.title = `🔔 (${added}) طلب جديد - لوحة الإدارة`; }
                firstSnap = false;
            }, err => { console.error(err); if (loggingOut) return; alert('تعذر تحميل الطلبات: ' + err.message); });
        }

        function switchTab(tab, btn) {
            document.querySelector('.admin-tabs').classList.remove('open');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        function compressImage(file) {
            return new Promise(res => {
                const r = new FileReader();
                r.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const s = Math.min(1, 800 / Math.max(img.width, img.height));
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        res(c.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                r.readAsDataURL(file);
            });
        }

        async function previewImageFile(input) {
            for (const f of Array.from(input.files)) {
                if (currentImages.length >= 5) { alert('الحد الأقصى 5 صور'); break; }
                currentImages.push(await compressImage(f));
            }
            input.value = '';
            renderThumbs();
        }

        function removeImage(i) { currentImages.splice(i, 1); renderThumbs(); }

        function renderThumbs() {
            document.getElementById('img-thumbs').innerHTML = currentImages.map((s, i) => `
                <div style="position:relative;"><img src="${s}" style="width:60px; height:60px; object-fit:cover; border-radius:6px; border:${i === 0 ? '2px solid var(--accent-dark)' : '1px solid #ddd'};">
                <span onclick="removeImage(${i})" style="position:absolute; top:-6px; left:-6px; background:#c0392b; color:#fff; border-radius:50%; width:18px; height:18px; font-size:13px; text-align:center; line-height:18px; cursor:pointer;">×</span></div>`).join('');
            const pv = document.getElementById('img-preview'), ph = document.getElementById('img-preview-placeholder');
            if (currentImages.length) { pv.src = currentImages[0]; pv.style.display = 'block'; ph.style.display = 'none'; }
            else { pv.style.display = 'none'; ph.style.display = 'block'; }
        }

        const STATUSES = { new: 'جديد', confirmed: 'تم التأكيد', shipped: 'اتشحن', delivered: 'اتسلّم', cancelled: 'ملغي' };
        const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const csvCell = v => { let t = String(v ?? ''); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
        const STATUS_COLORS = { new: '#2c6fbb', confirmed: '#b9770e', shipped: '#7d3c98', delivered: '#1f7244', cancelled: '#c0392b' };

        function renderOrders() {
            const container = document.getElementById('admin-orders-list');
            const opened = new Set(Array.from(container.querySelectorAll('details[open]')).map(d => d.dataset.id));
            const f = document.getElementById('order-filter').value;
            const drafts = {};
            container.querySelectorAll('.ord-ext[data-dirty]').forEach(el => { drafts[el.dataset.id + '|' + el.dataset.k] = el.value; });
            const q = (document.getElementById('order-search') ? document.getElementById('order-search').value : '').trim().toLowerCase();
            const list = (f === 'all' ? orders : orders.filter(o => (o.status || 'new') === f))
                .filter(o => !q || [o.orderId, o.customer.name, o.customer.phone, o.customer.phone2, o.shipNo, o.note].join(' ').toLowerCase().includes(q));
            const extVal = (o, k) => { const dk = o.orderId + '|' + k; return dk in drafts ? drafts[dk] : (o[k] || ''); };
            const extDirty = (o, k) => (o.orderId + '|' + k) in drafts ? 'data-dirty="1"' : '';
            if (list.length === 0) { container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">لا توجد طلبات.</div>'; return; }
            container.innerHTML = list.map(ord => {
                const st = ord.status || 'new';
                return `
                <details class="acc" data-id="${ord.orderId}" ${opened.has(ord.orderId) ? 'open' : ''} style="border-right:4px solid ${STATUS_COLORS[st]};">
                    <summary>
                        <span><input type="checkbox" class="order-cb" data-id="${ord.orderId}" onclick="event.stopPropagation()"> <strong>${esc(ord.customer.name)}</strong> <span class="acc-sub">${ord.orderId}${ord.shipNo ? ' 🚚' : ''}${ord.note ? ' 📝' : ''}</span></span>
                        <span><strong style="color:var(--success-color);">${ord.total} ج.م</strong> <span style="color:${STATUS_COLORS[st]};">${STATUSES[st]}</span></span>
                    </summary>
                    <div class="acc-body">
                        <div style="color:var(--text-muted);">${esc(ord.dateStr)}${ord.coupon ? ` — كوبون ${esc(ord.coupon)}: -${esc(ord.discount)} ج.م` : ''}</div>
                        <div><strong>الهاتف 1:</strong> ${esc(ord.customer.phone)} | <strong>الهاتف 2:</strong> ${esc(ord.customer.phone2)}</div>
                        <div><strong>العنوان:</strong> ${esc(ord.customer.gov)} - ${esc(ord.customer.address)}</div>
                        <div><strong>المنتجات:</strong> ${ord.items.map(i => `${esc(i.title)} (${esc(i.size)}/${esc(i.color)})`).join(' - ')}</div>
                        <div style="margin-top:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                            <strong>الحالة:</strong>
                            <select class="form-select" style="width:auto; padding:3px 8px; font-size:12px;" onchange="changeStatus('${ord.orderId}', this.value)">
                                ${Object.entries(STATUSES).map(([k, v]) => `<option value="${k}" ${k === st ? 'selected' : ''}>${v}</option>`).join('')}
                            </select>
                            <a href="https://wa.me/20${String(ord.customer.phone).replace(/\D/g, '').replace(/^0/, '')}?text=${encodeURIComponent('أهلاً ' + ord.customer.name + ' 👋 بنأكد معاك طلبك رقم ' + ord.orderId + ' من Zazoua بإجمالي ' + ord.total + ' ج.م. تمام كده؟')}" target="_blank" rel="noopener" style="background:#25D366; color:#fff; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:700; text-decoration:none;">واتساب العميل</a>
                        </div>
                        <div style="margin-top:8px; display:grid; gap:6px;">
                            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                                <input class="ord-ext" data-id="${ord.orderId}" data-k="shipCo" ${extDirty(ord, 'shipCo')} oninput="this.dataset.dirty=1" maxlength="40" value="${esc(extVal(ord, 'shipCo'))}" placeholder="شركة الشحن" style="flex:1; min-width:110px; padding:6px 8px; border:1px solid var(--border-color); border-radius:6px; font-size:12px; font-family:inherit;">
                                <input class="ord-ext" data-id="${ord.orderId}" data-k="shipNo" ${extDirty(ord, 'shipNo')} oninput="this.dataset.dirty=1" maxlength="60" value="${esc(extVal(ord, 'shipNo'))}" placeholder="رقم الشحنة (يظهر للعميل)" style="flex:1; min-width:110px; padding:6px 8px; border:1px solid var(--border-color); border-radius:6px; font-size:12px; font-family:inherit;">
                            </div>
                            <textarea class="ord-ext" data-id="${ord.orderId}" data-k="note" ${extDirty(ord, 'note')} oninput="this.dataset.dirty=1" maxlength="500" rows="2" placeholder="ملاحظة داخلية (لا تظهر للعميل)" style="padding:6px 8px; border:1px solid var(--border-color); border-radius:6px; font-size:12px; font-family:inherit; resize:vertical;">${esc(extVal(ord, 'note'))}</textarea>
                            <button onclick="saveOrderExtra('${ord.orderId}')" style="cursor:pointer; border:none; color:#fff; background:var(--accent-dark); padding:6px 12px; border-radius:6px; font-size:12px; font-weight:700; justify-self:start;">حفظ الملاحظة والشحن</button>
                        </div>
                    </div>
                </details>`;
            }).join('');
        }

        async function saveOrderExtra(orderId) {
            const o = orders.find(x => x.orderId === orderId); if (!o) return;
            const g = k => { const el = document.querySelector(`.ord-ext[data-id="${orderId}"][data-k="${k}"]`); return el ? el.value.trim() : ''; };
            const data = { note: g('note').slice(0, 500), shipCo: g('shipCo').slice(0, 40), shipNo: g('shipNo').slice(0, 60) };
            try {
                await fb.updateOrder(orderId, data);
                await fb.setTracking({ orderId, status: o.status || 'new', phone4: String(o.customer.phone).slice(-4), createdAt: o.createdAt || 0, shipCo: data.shipCo, shipNo: data.shipNo });
            } catch (err) { alert('فشل الحفظ: ' + err.message); return; }
            Object.assign(o, data);
            document.querySelectorAll(`.ord-ext[data-id="${orderId}"]`).forEach(el => el.removeAttribute('data-dirty'));
            renderOrders();
        }

        async function changeStatus(orderId, status) {
            try { await fb.updateOrder(orderId, { status }); const o0 = orders.find(x => x.orderId === orderId); if (o0) await fb.setTracking({ orderId, status, phone4: String(o0.customer.phone).slice(-4), createdAt: o0.createdAt || 0 }); } catch (err) { alert('فشل تحديث الحالة: ' + err.message); return; }
            const o = orders.find(x => x.orderId === orderId); if (o) o.status = status;
            renderOrders();
        }

        async function deleteSelectedOrders() {
            const ids = Array.from(document.querySelectorAll('.order-cb:checked')).map(cb => cb.dataset.id);
            if (!ids.length) { alert('حدد طلب واحد على الأقل للحذف'); return; }
            if (!confirm(`سيتم حذف ${ids.length} طلب نهائيًا ولا يمكن التراجع عن ذلك. هل أنت متأكد؟`)) return;
            try { await Promise.all(ids.map(id => fb.deleteOrder(id))); }
            catch (err) { alert('فشل الحذف: ' + err.message); return; }
            document.getElementById('select-all').checked = false;
        }

        function toggleSelectAll(master) { document.querySelectorAll('.order-cb').forEach(cb => cb.checked = master.checked); }

        function printSelectedInvoices() {
            const ids = Array.from(document.querySelectorAll('.order-cb:checked')).map(cb => cb.dataset.id);
            if (ids.length === 0) { alert('حدد طلب واحد على الأقل للطباعة'); return; }
            const printOrders = orders.filter(o => ids.includes(o.orderId));
            document.getElementById('print-area').innerHTML = printOrders.map(ord => {
                const items = ord.items || [];
                const sub = ord.subtotal != null ? ord.subtotal : items.reduce((s, i) => s + (Number(i.price) || 0), 0);
                const p2 = ord.customer.phone2 && ord.customer.phone2 !== 'لا يوجد' ? ' &nbsp;|&nbsp; ' + esc(ord.customer.phone2) : '';
                return `
                <div class="print-invoice-item">
                    <div class="inv-brand">Zazoua</div>
                    <div class="inv-meta"><span>فاتورة رقم: <b>${esc(ord.orderId)}</b></span><span>${esc(ord.dateStr)}</span></div>
                    <div class="inv-cust">
                        <div><b>العميل:</b> ${esc(ord.customer.name)}</div>
                        <div><b>الهاتف:</b> ${esc(ord.customer.phone)}${p2}</div>
                        <div class="full"><b>العنوان:</b> ${esc(ord.customer.gov)} - ${esc(ord.customer.address)}</div>
                    </div>
                    <table class="inv-table">
                        <thead><tr><th>#</th><th>المنتج</th><th>المقاس</th><th>اللون</th><th>السعر</th></tr></thead>
                        <tbody>${items.map((i, n) => `<tr><td>${n + 1}</td><td>${esc(i.title)}</td><td>${esc(i.size)}</td><td>${esc(i.color)}</td><td>${esc(i.price)} ج.م</td></tr>`).join('')}</tbody>
                    </table>
                    <div class="inv-totals">
                        <div class="inv-lines"><span>المنتجات: ${esc(sub)} ج.م</span><span>الشحن: ${esc(ord.shipping)} ج.م</span>${ord.discount ? `<span>الخصم: ${esc(ord.discount)} ج.م</span>` : ''}</div>
                        <div class="inv-total">الإجمالي: ${esc(ord.total)} ج.م</div>
                    </div>
                    <div class="inv-note">ملاحظة: في حالة رفض الاستلام يتم دفع 30 ج فقط للمندوب.</div>
                </div>`;
            }).join('');
            window.print();
        }

        function exportToExcel() {
            if (orders.length === 0) { alert('لا توجد طلبات للتصدير'); return; }
            let csv = "\uFEFFرقم الطلب,التاريخ,اسم العميل,رقم الهاتف 1,رقم الهاتف 2,المحافظة,العنوان,المنتجات,الإجمالي,شركة الشحن,رقم الشحنة,ملاحظة\n";
            orders.forEach(o => {
                const items = o.items.map(i => `${i.title} (${i.size}/${i.color})`).join(' - ');
                csv += [o.orderId, o.dateStr, o.customer.name, o.customer.phone, o.customer.phone2, o.customer.gov, o.customer.address, items, o.total, o.shipCo, o.shipNo, o.note].map(csvCell).join(",") + "\n";
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Zazoua_Orders.csv`;
            link.click();
        }

        function renderProductsAdmin() {
            const el = document.getElementById('admin-products-list');
            const opened = new Set(Array.from(el.querySelectorAll('details[open]')).map(d => d.dataset.id));
            el.innerHTML = products.map(p => `
                <details class="acc" data-id="${p.id}" ${opened.has(String(p.id)) ? 'open' : ''} style="${p.hidden ? 'opacity:.6;' : ''}">
                    <summary>
                        <span style="display:flex; align-items:center; gap:8px;"><img src="${p.image}" style="width:35px; height:35px; object-fit:cover; border-radius:4px;"><strong>${p.title}</strong></span>
                        <span>${p.price} ج.م ${p.soldOut ? '<span style="color:#c0392b;">• نفذت</span>' : ''}${p.hidden ? '<span style="color:#888;">• مخفي</span>' : ''}</span>
                    </summary>
                    <div class="acc-body">
                        <div><strong>القسم:</strong> ${p.mainCat} / ${p.subCat}</div>
                        <div><strong>المقاسات:</strong> ${p.sizes.join('، ')} | <strong>الألوان:</strong> ${p.colors.join('، ')}</div>
                        <div style="display:flex; gap:4px; flex-wrap:wrap; margin-top:8px;">
                            <button onclick="editProduct(${p.id})" style="cursor:pointer; border:none; color:white; padding:4px 8px; border-radius:4px; font-size:11px; background:#2c6fbb;">تعديل</button>
                            <button onclick="toggleFlag(${p.id}, 'soldOut')" style="cursor:pointer; border:none; color:white; padding:4px 8px; border-radius:4px; font-size:11px; background:#b9770e;">${p.soldOut ? 'متوفر' : 'نفذت'}</button>
                            <button onclick="toggleFlag(${p.id}, 'hidden')" style="cursor:pointer; border:none; color:white; padding:4px 8px; border-radius:4px; font-size:11px; background:#666;">${p.hidden ? 'إظهار' : 'إخفاء'}</button>
                            <button onclick="copyAdLink(${p.id})" style="cursor:pointer; border:none; color:white; padding:4px 8px; border-radius:4px; font-size:11px; background:var(--accent-dark);">رابط الإعلان</button>
                            <button onclick="deleteProduct(${p.id})" style="cursor:pointer; border:none; color:white; padding:4px 8px; border-radius:4px; font-size:11px; background:var(--danger-color);">حذف</button>
                        </div>
                    </div>
                </details>
            `).join('');
        }

        function resetProductForm() {
            document.getElementById('product-form').reset();
            document.getElementById('edit-prod-id').value = '';
            currentImages = []; renderThumbs();
            document.getElementById('prod-save-btn').innerText = 'حفظ المنتج';
            document.getElementById('prod-cancel-btn').style.display = 'none';
        }
        function cancelEdit() { resetProductForm(); }

        function editProduct(id) {
            const p = products.find(x => x.id == id);
            if (!p) return;
            document.getElementById('edit-prod-id').value = p.id;
            document.getElementById('prod-title').value = p.title;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-old-price').value = p.oldPrice || '';
            document.getElementById('prod-sizechart').value = p.sizeChart || '';
            document.getElementById('prod-main-cat').value = p.mainCat;
            document.getElementById('prod-sub-cat').value = p.subCat;
            document.getElementById('prod-sizes').value = p.sizes.join(', ');
            document.getElementById('prod-colors').value = p.colors.join(', ');
            currentImages = (p.images && p.images.length) ? [...p.images] : [p.image];
            renderThumbs();
            document.getElementById('prod-save-btn').innerText = 'حفظ التعديلات';
            document.getElementById('prod-cancel-btn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function toggleFlag(id, flag) {
            const p = products.find(x => x.id == id);
            if (!p) return;
            const updated = { ...p, [flag]: !p[flag] };
            try { await fb.saveProduct(updated); } catch (err) { alert('فشل الحفظ: ' + err.message); return; }
            products = products.map(x => x.id == id ? updated : x);
            renderProductsAdmin();
        }

        async function handleProductSave(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-prod-id').value;
            const old = editId ? products.find(p => p.id == editId) : null;
            const prod = {
                ...(old || {}),
                id: old ? old.id : Date.now(),
                title: document.getElementById('prod-title').value.trim(),
                price: parseFloat(document.getElementById('prod-price').value),
                oldPrice: parseFloat(document.getElementById('prod-old-price').value) || 0,
                sizeChart: document.getElementById('prod-sizechart').value.trim(),
                mainCat: document.getElementById('prod-main-cat').value,
                subCat: document.getElementById('prod-sub-cat').value.trim(),
                sizes: document.getElementById('prod-sizes').value.split(',').map(s => s.trim()),
                colors: document.getElementById('prod-colors').value.split(',').map(c => c.trim()),
                image: currentImages[0] || '', images: currentImages
            };
            if (!prod.image) { alert('يرجى اختيار صورة للمنتج من المعرض أولاً!'); return; }
            if (JSON.stringify(prod).length > 950000) { alert('حجم الصور كبير، قلّل عدد الصور'); return; }
            try { await fb.saveProduct(prod); } catch (err) { console.error(err); alert('فشل الحفظ: ' + err.message); return; }
            if (old) products = products.map(p => p.id === prod.id ? prod : p); else products.unshift(prod);
            renderProductsAdmin();
            resetProductForm();
            alert(old ? 'تم حفظ التعديلات ✅' : 'تم حفظ المنتج بنجاح، وهو ظاهر الآن للعملاء!');
        }

        async function deleteProduct(id) {
            if (!confirm('هل أنت متأكد من حذف المنتج؟')) return;
            try { await fb.deleteProduct(id); } catch (err) { alert('فشل الحذف: ' + err.message); return; }
            products = products.filter(p => p.id !== id);
            renderProductsAdmin();
        }

        function copyAdLink(id) {
            const url = `${window.location.origin}${window.location.pathname.replace('admin.html', '')}index.html?product=${id}`;
            navigator.clipboard.writeText(url).then(() => alert('تم نسخ رابط المنتج للإعلانات الممولة! 🔗'));
        }

        function renderShipping() {
            document.getElementById('shipping-list').innerHTML = shippingRates.map(r => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:var(--bg-main); border:1px solid var(--border-color); border-radius:6px; margin-bottom:4px; font-size:12px;">
                    <span>${r.name}</span>
                    <span><strong>${r.price} ج.م</strong> <button onclick="deleteGov('${r.id}')" style="cursor:pointer; border:none; color:white; padding:4px 8px; border-radius:4px; font-size:11px; background:var(--danger-color); margin-right:6px;">حذف</button></span>
                </div>
            `).join('');
        }

        async function deleteGov(id) {
            if (!confirm('حذف هذه المحافظة من أسعار الشحن؟')) return;
            try { await fb.deleteShipping(id); } catch (err) { alert('فشل الحذف: ' + err.message); return; }
            shippingRates = shippingRates.filter(r => String(r.id) !== String(id));
            renderShipping();
        }

        async function handleAddGov(e) {
            e.preventDefault();
            const name = document.getElementById('gov-name').value.trim();
            const price = parseInt(document.getElementById('gov-price').value);
            const rate = { id: 'gov-' + Date.now(), name, price };
            try { await fb.saveShipping(rate); } catch (err) { alert('فشل الحفظ: ' + err.message); return; }
            shippingRates.push(rate);
            renderShipping();
        }
    </script>
</body>
</html>
