<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zazoua Admin - لوحة التحكم والإدارة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #f8f9fa; --bg-card: #ffffff; --text-main: #1a1a1a;
            --text-muted: #6c757d; --accent-dark: #121212; --border-color: #e9ecef;
            --brand-gray: #f1f3f5; --success-color: #27ae60; --danger-color: #e74c3c;
            --radius-md: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .admin-title { font-size: 20px; font-weight: 800; }
        .back-to-store { text-decoration: none; background: var(--accent-dark); color: white; padding: 7px 15px; border-radius: 20px; font-size: 12px; font-weight: 700; }

        .admin-tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .tab-btn { background: none; border: none; padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-radius: 6px; }
        .tab-btn.active { background: var(--accent-dark); color: white; }

        .admin-section { display: none; background: white; padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
        .admin-section.active { display: block; }

        .form-group { margin-bottom: 12px; }
        .form-label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
        .form-input, .form-select { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 13px; }

        .submit-btn { background: var(--success-color); color: white; border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }
        .admin-order-card { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; font-size: 12px; }

        /* PRINT STYLES - 3 Invoices Per Page */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; top: 0; left: 0; width: 100%; background: white; }
            .print-invoice-item { height: 31%; border: 2px dashed #000; border-radius: 8px; padding: 12px; margin-bottom: 2%; page-break-inside: avoid; display: flex; flex-direction: column; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول لحماية صفحة الإدارة -->
    <div id="login-overlay" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:9999; display:flex; align-items:center; justify-content:center;">
        <div style="background:white; padding:25px; border-radius:12px; width:100%; max-width:350px;">
            <h3 style="font-size:16px; font-weight:800; margin-bottom:15px; text-align:center;">دخول لوحة تحكم Zazoua 👑</h3>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="admin-email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">كلمة السر</label>
                    <input type="password" id="admin-pass" class="form-input" required>
                </div>
                <button type="submit" class="submit-btn" style="width:100%; background:var(--accent-dark);">دخول</button>
            </form>
        </div>
    </div>

    <div class="admin-header">
        <div class="admin-title">لوحة الإدارة والمتابعة 👑</div>
        <a href="index.html" class="back-to-store"><i class="fa-solid fa-store"></i> المعاينة كعميل</a>
    </div>

    <div class="admin-tabs">
        <button class="tab-btn active" onclick="switchTab('orders', this)"><i class="fa-solid fa-boxes-packing"></i> الطلبات الواردة</button>
        <button class="tab-btn" onclick="switchTab('products', this)"><i class="fa-solid fa-shirt"></i> إدارة المنتجات</button>
        <button class="tab-btn" onclick="switchTab('shipping', this)"><i class="fa-solid fa-truck-rampage"></i> أسعار الشحن</button>
    </div>

    <!-- TAB 1: ORDERS -->
    <div id="tab-orders" class="admin-section active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div>
                <input type="checkbox" id="select-all" onchange="toggleSelectAll(this)">
                <label for="select-all" style="font-size: 12px; font-weight: 700;">تحديد الكل</label>
            </div>
            <div>
                <button onclick="printSelectedInvoices()" class="submit-btn" style="background:var(--accent-dark); font-size:12px;"><i class="fa-solid fa-print"></i> طباعة الفواتير المحددة (3/صفحة)</button>
                <button onclick="exportToExcel()" class="submit-btn" style="background:#1f7244; font-size:12px;"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
            </div>
        </div>
        <div id="admin-orders-list"></div>
    </div>

    <!-- TAB 2: PRODUCTS -->
    <div id="tab-products" class="admin-section">
        <form id="product-form" onsubmit="handleProductSave(event)">
            <input type="hidden" id="edit-prod-id">
            
            <div class="form-group">
                <label class="form-label">صورة المنتج (من المعرض/الاستوديو) *</label>
                <input type="file" id="prod-img-file" accept="image/*" onchange="previewImageFile(this)" style="display: none;">
                <div onclick="document.getElementById('prod-img-file').click()" style="height: 120px; border: 2px dashed var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--bg-main); overflow: hidden;">
                    <div id="img-preview-placeholder" style="text-align: center; color: var(--text-muted);">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 24px; margin-bottom: 4px;"></i>
                        <p style="font-size: 11px; font-weight: 700;">اضغط لاختيار صورة المنتج من جهازك</p>
                    </div>
                    <img id="img-preview" src="" style="display: none; width: 100%; height: 100%; object-fit: contain;">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label class="form-label">اسم المنتج *</label>
                    <input type="text" id="prod-title" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">السعر (ج.م) *</label>
                    <input type="number" id="prod-price" class="form-input" required>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label class="form-label">التصنيف الرئيسي *</label>
                    <select id="prod-main-cat" class="form-select" required>
                        <option value="men">ملابس رجالي</option>
                        <option value="women">ملابس حريمي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">القسم الفرعي *</label>
                    <input type="text" id="prod-sub-cat" class="form-input" placeholder="مثال: شال، بنطلون..." required>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label class="form-label">المقاسات (بفواصل)</label>
                    <input type="text" id="prod-sizes" class="form-input" value="M, L, XL, 2XL" required>
                </div>
                <div class="form-group">
                    <label class="form-label">الألوان (بفواصل)</label>
                    <input type="text" id="prod-colors" class="form-input" value="أسود, أبيض, رمادي" required>
                </div>
            </div>

            <button type="submit" class="submit-btn" style="background:var(--accent-dark); width: 100%; margin-top: 10px;">حفظ المنتج</button>
        </form>

        <hr style="margin:20px 0;">
        <h4 style="font-size:14px; margin-bottom:10px;">قائمة المنتجات الحالية وروابطها للإعلانات:</h4>
        <div id="admin-products-list"></div>
    </div>

    <!-- TAB 3: SHIPPING -->
    <div id="tab-shipping" class="admin-section">
        <form onsubmit="handleAddGov(event)" style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input type="text" id="gov-name" class="form-input" placeholder="اسم المحافظة" required>
            <input type="number" id="gov-price" class="form-input" placeholder="السعر" required>
            <button type="submit" class="submit-btn">إضافة</button>
        </form>
        <div id="shipping-list"></div>
    </div>

    <div id="print-area"></div>

    <script>
        const OWNER_EMAIL = "trader872007@gmail.com";
        const OWNER_PASS = "ANAomarmok7tar2007";

        const defaultProducts = [
            { id: 1, title: 'شال حريمي راقي', price: 350, mainCat: 'women', subCat: 'شال', sizes: ['M', 'L', 'XL', '2XL'], colors: ['أسود', 'أبيض', 'رمادي'], image: 'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=600&q=80' },
            { id: 2, title: 'بنطلون كاجوال رجالي', price: 480, mainCat: 'men', subCat: 'بنطلون', sizes: ['30', '32', '34', '36'], colors: ['أسود', 'رمادي'], image: 'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=600&q=80' }
        ];

        const defaultShippingRates = [
            { id: 'cairo', name: 'القاهرة', price: 55 },
            { id: 'giza', name: 'الجيزة', price: 55 },
            { id: 'alex', name: 'الإسكندرية', price: 60 }
        ];

        let products = JSON.parse(localStorage.getItem('zazoua_products')) || defaultProducts;
        let shippingRates = JSON.parse(localStorage.getItem('zazoua_shipping')) || defaultShippingRates;
        let orders = JSON.parse(localStorage.getItem('zazoua_orders')) || [];
        let currentImageData = '';

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim().toLowerCase();
            const pass = document.getElementById('admin-pass').value.trim();
            if (email === OWNER_EMAIL.toLowerCase() && pass === OWNER_PASS) {
                document.getElementById('login-overlay').style.display = 'none';
                renderOrders(); renderProductsAdmin(); renderShipping();
            } else alert('بيانات الدخول غير صحيحة!');
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        function previewImageFile(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageData = e.target.result;
                    const previewImg = document.getElementById('img-preview');
                    previewImg.src = currentImageData;
                    previewImg.style.display = 'block';
                    document.getElementById('img-preview-placeholder').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        function renderOrders() {
            const container = document.getElementById('admin-orders-list');
            if (orders.length === 0) { container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">لا توجد طلبات واردة بعد.</div>'; return; }
            container.innerHTML = orders.map(ord => `
                <div class="admin-order-card">
                    <div style="display:flex; justify-content:space-between; border-bottom:1px dashed #ccc; padding-bottom:4px; margin-bottom:6px;">
                        <div><input type="checkbox" class="order-cb" data-id="${ord.orderId}"> <strong>رقم الطلب: ${ord.orderId}</strong> (${ord.dateStr})</div>
                        <strong style="color:var(--success-color);">${ord.total} ج.م</strong>
                    </div>
                    <div>👤 <strong>العميل:</strong> ${ord.customer.name} | <strong>الهاتف 1:</strong> ${ord.customer.phone} | <strong>الهاتف 2:</strong> ${ord.customer.phone2}</div>
                    <div>📍 <strong>العنوان:</strong> ${ord.customer.gov} - ${ord.customer.address}</div>
                    <div style="margin-top:4px; color:var(--text-muted);"><strong>التفاصيل:</strong> ${ord.items.map(i => `${i.title} (${i.size}/${i.color})`).join(' - ')}</div>
                </div>
            `).join('');
        }

        function toggleSelectAll(master) { document.querySelectorAll('.order-cb').forEach(cb => cb.checked = master.checked); }

        function printSelectedInvoices() {
            const ids = Array.from(document.querySelectorAll('.order-cb:checked')).map(cb => cb.dataset.id);
            if (ids.length === 0) { alert('حدد طلب واحد على الأقل للطباعة'); return; }
            const printOrders = orders.filter(o => ids.includes(o.orderId));
            document.getElementById('print-area').innerHTML = printOrders.map(ord => `
                <div class="print-invoice-item">
                    <div style="display:flex; justify-content:space-between; border-bottom:2px solid #000; padding-bottom:4px;">
                        <h2>Zazoua Store</h2><div>فاتورة طلب: ${ord.orderId}<br>${ord.dateStr}</div>
                    </div>
                    <div style="font-size:13px; margin:8px 0;">
                        <div><strong>العميل:</strong> ${ord.customer.name} | <strong>الهاتف 1:</strong> ${ord.customer.phone} | <strong>الهاتف 2:</strong> ${ord.customer.phone2}</div>
                        <div><strong>العنوان:</strong> ${ord.customer.gov} - ${ord.customer.address}</div>
                    </div>
                    <table style="width:100%; border-collapse:collapse; font-size:12px;">
                        <tr style="background:#eee;"><th>المنتج</th><th>المقاس</th><th>اللون</th><th>السعر</th></tr>
                        ${ord.items.map(i => `<tr><td>${i.title}</td><td>${i.size}</td><td>${i.color}</td><td>${i.price} ج.م</td></tr>`).join('')}
                    </table>
                    <div style="border-top:1px solid #000; padding-top:4px; display:flex; justify-content:space-between; font-weight:bold;">
                        <span>الشحن: ${ord.shipping} ج.م</span><span>الإجمالي الكلي: ${ord.total} ج.م</span>
                    </div>
                </div>
            `).join('');
            window.print();
        }

        function exportToExcel() {
            if (orders.length === 0) { alert('لا توجد طلبات للتصدير'); return; }
            let csv = "\uFEFFرقم الطلب,التاريخ,اسم العميل,رقم الهاتف 1,رقم الهاتف 2,المحافظة,العنوان,المنتجات,الإجمالي\n";
            orders.forEach(o => {
                const items = o.items.map(i => `${i.title} (${i.size}/${i.color})`).join(' - ');
                csv += `"${o.orderId}","${o.dateStr}","${o.customer.name}","${o.customer.phone}","${o.customer.phone2}","${o.customer.gov}","${o.customer.address}","${items}","${o.total}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Zazoua_Orders.csv`;
            link.click();
        }

        function renderProductsAdmin() {
            document.getElementById('admin-products-list').innerHTML = products.map(p => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:8px; background:var(--bg-main); border:1px solid var(--border-color); border-radius:6px; margin-bottom:6px; font-size:12px;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <img src="${p.image}" style="width:35px; height:35px; object-fit:cover; border-radius:4px;">
                        <strong>${p.title}</strong> (${p.price} ج.م)
                    </div>
                    <div>
                        <button onclick="copyAdLink(${p.id})" style="background:var(--accent-dark); color:white; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;">نسخ رابط الإعلان 🔗</button>
                        <button onclick="deleteProduct(${p.id})" style="background:var(--danger-color); color:white; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer; margin-right:4px;">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        function handleProductSave(e) {
            e.preventDefault();
            const title = document.getElementById('prod-title').value.trim();
            const price = parseFloat(document.getElementById('prod-price').value);
            const mainCat = document.getElementById('prod-main-cat').value;
            const subCat = document.getElementById('prod-sub-cat').value.trim();
            const sizes = document.getElementById('prod-sizes').value.split(',').map(s => s.trim());
            const colors = document.getElementById('prod-colors').value.split(',').map(c => c.trim());

            if (!currentImageData) { alert('يرجى اختيار صورة للمنتج من المعرض أولاً!'); return; }

            products.unshift({ id: Date.now(), title, price, mainCat, subCat, sizes, colors, image: currentImageData });
            localStorage.setItem('zazoua_products', JSON.stringify(products));
            renderProductsAdmin();
            
            document.getElementById('product-form').reset();
            currentImageData = '';
            document.getElementById('img-preview').style.display = 'none';
            document.getElementById('img-preview-placeholder').style.display = 'block';
            alert('تم حفظ المنتج بنجاح من المعرض!');
        }

        function deleteProduct(id) {
            if (confirm('هل أنت متأكد من حذف المنتج؟')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('zazoua_products', JSON.stringify(products));
                renderProductsAdmin();
            }
        }

        function copyAdLink(id) {
            const url = `${window.location.origin}${window.location.pathname.replace('admin.html', '')}index.html?product=${id}`;
            navigator.clipboard.writeText(url).then(() => alert('تم نسخ رابط المنتج للإعلانات الممولة! 🔗'));
        }

        function renderShipping() {
            document.getElementById('shipping-list').innerHTML = shippingRates.map(r => `
                <div style="display:flex; justify-content:space-between; padding:6px 10px; background:var(--bg-main); border:1px solid var(--border-color); border-radius:6px; margin-bottom:4px; font-size:12px;">
                    <span>${r.name}</span><strong>${r.price} ج.م</strong>
                </div>
            `).join('');
        }

        function handleAddGov(e) {
            e.preventDefault();
            const name = document.getElementById('gov-name').value.trim();
            const price = parseInt(document.getElementById('gov-price').value);
            shippingRates.push({ id: 'gov-' + Date.now(), name, price });
            localStorage.setItem('zazoua_shipping', JSON.stringify(shippingRates));
            renderShipping();
        }
    </script>
</body>
</html>
