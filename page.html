<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zazoua</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#f8f9fa;color:#1a1a1a;min-height:100vh}
header{background:#fff;border-bottom:1px solid #e9ecef;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;color:#121212;text-decoration:none}
.back{font-size:13px;font-weight:700;color:#121212;text-decoration:none}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 12px 0}
nav a{font-size:13px;font-weight:700;padding:7px 14px;border-radius:20px;background:#fff;border:1px solid #e9ecef;color:#121212;text-decoration:none}
nav a.on{background:#121212;color:#fff}
main{max-width:640px;margin:16px auto;padding:0 14px}
.box{background:#fff;border:1px solid #e9ecef;border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
h1{font-size:20px;font-weight:800;margin-bottom:12px}
#body{font-size:14px;line-height:1.9;white-space:pre-line}
.wa{display:none;margin-top:16px;background:#25D366;color:#fff;text-align:center;padding:12px;border-radius:10px;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<header><a class="brand" href="index.html">Zazoua</a><a class="back" href="index.html">← العودة للمتجر</a></header>
<nav id="nav"></nav>
<main><div class="box"><h1 id="title">...</h1><div id="body">جاري التحميل...</div><a id="wa" class="wa" target="_blank" rel="noopener">💬 تواصل معنا على واتساب</a></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app = initializeApp({ apiKey: "AIzaSyDsQTX9rCxxT7Dl-OhDSkrce85lM_yDaf4", authDomain: "zazoua-b4d33.firebaseapp.com", projectId: "zazoua-b4d33", storageBucket: "zazoua-b4d33.firebasestorage.app", messagingSenderId: "990100552162", appId: "1:990100552162:web:5b886a47ef93ff3ad7a1bb" });
// App Check (reCAPTCHA Enterprise / Fraud Defense) - لازم يتعمل قبل أي استخدام لـ Firestore
try { initializeAppCheck(app, { provider: new ReCaptchaEnterpriseProvider("6LeTMBouAAAAAPog_ic7r83Gn1IKcq0C9laQMCqT"), isTokenAutoRefreshEnabled: true }); } catch (e) { console.warn("AppCheck init failed", e); }
const db = getFirestore(app);
const PAGES = { about: ['من نحن', 'aboutText'], policy: ['سياسة الاستبدال والاسترجاع', 'policyText'], contact: ['تواصل معنا', 'contactText'], faq: ['الأسئلة الشائعة', 'faqText'], privacy: ['سياسة الخصوصية', 'privacyText'] };
const DEFAULT_PRIVACY = `بنحترم خصوصيتك. الصفحة دي بتوضح إزاي بنتعامل مع بياناتك:

- البيانات اللي بنجمعها: الاسم، أرقام الهاتف، المحافظة والعنوان، ومحتوى طلبك، وده بس اللي بتكتبه بنفسك في صفحة الطلب.
- بنستخدمها في: تجهيز طلبك وشحنه، والتواصل معاك بخصوص الطلب، وتتبع حالته.
- لو بدأت تكتب طلب ومكمّلتوش، ممكن نحتفظ بالبيانات اللي كتبتها عشان نتواصل معاك ونساعدك تكمّل الطلب.
- بنشارك بيانات التوصيل (الاسم والهاتف والعنوان) مع شركة الشحن بس عشان توصّلك الطلب.
- الموقع بيستخدم أدوات تحليل وإعلانات (زي Meta Pixel وTikTok Pixel وMicrosoft Clarity) بتجمع بيانات عن استخدامك للموقع عن طريق ملفات الارتباط (Cookies) لتحسين الخدمة وقياس الإعلانات.
- مش بنبيع بياناتك لأي طرف.
- تقدر تطلب حذف بياناتك أو تعديلها في أي وقت بالتواصل معانا من صفحة (تواصل معنا).`;
const p = PAGES[new URLSearchParams(location.search).get('p')] ? new URLSearchParams(location.search).get('p') : 'about';
document.getElementById('nav').innerHTML = Object.entries(PAGES).map(([k, v]) => `<a href="page.html?p=${k}" class="${k === p ? 'on' : ''}">${v[0]}</a>`).join('');
document.getElementById('title').textContent = PAGES[p][0];
document.title = PAGES[p][0] + ' - Zazoua';
try {
  const s = await getDoc(doc(db, 'settings', 'main'));
  const d = s.exists() ? s.data() : {};
  document.getElementById('body').textContent = d[PAGES[p][1]] || (p === 'privacy' ? DEFAULT_PRIVACY : 'سيتم إضافة المحتوى قريبًا.');
  let n = String(d.whatsapp || '').replace(/\D/g, '');
  if (n.startsWith('0')) n = '20' + n.slice(1);
  if (p === 'contact' && n) { const a = document.getElementById('wa'); a.href = 'https://wa.me/' + n; a.style.display = 'block'; }
} catch (e) { document.getElementById('body').textContent = 'تعذر تحميل الصفحة، حاول مرة أخرى.'; }
</script>
</body>
</html>
